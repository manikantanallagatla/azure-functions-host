syntax = "proto3";

package AzureFunctionsWorkerLink;
option csharp_namespace = "Microsoft.Azure.WebJobs.Script.Grpc.WorkerLink";

// Platform control traffic; never forwarded to the customer worker.
service WorkerLink {
  rpc Accept (AcceptLinkRequest) returns (AcceptLinkResponse);
}

message AcceptLinkRequest {
  string initialization_id = 1;
  RuntimeIdentity runtime = 2;
}

message AcceptLinkResponse {}

message RuntimeIdentity {
  string resource_namespace = 1;
  string pod_name = 2;
  string pod_guid = 3;
  string legion_stamp_name = 4;
  string pod_type = 5;
  FunctionAppIdentity app = 6;
}

message FunctionAppIdentity {
  string function_app_name = 1;
  int32 function_app_site_id = 2;
  string antares_stamp_name = 3;
}
