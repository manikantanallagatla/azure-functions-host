syntax = "proto3";

package AzureFunctionsWorkerLink;
option csharp_namespace = "Microsoft.Azure.WebJobs.Script.Grpc.WorkerLink";

// Platform control traffic; never forwarded to the customer worker.
service WorkerLink {
  rpc Accept (AcceptLinkRequest) returns (AcceptLinkResponse);
}

message AcceptLinkRequest {
  string initialization_id = 1;
}

message AcceptLinkResponse {}
